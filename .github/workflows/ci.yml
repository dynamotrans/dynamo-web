# Red de seguridad en cada subida (revisión de calidad, 2026-11-05): si algo falla, se ve en
# rojo en GitHub antes de darlo por bueno.
#   1. Base de datos: aplica todas las migraciones en un PostgreSQL de usar y tirar que imita a
#      Supabase, pasa las pruebas de seguridad y de reglas (tools/probar-migraciones) y comprueba
#      que los tipos de TypeScript (lib/supabase/tipos.ts) están al día.
#   2. Web: tipos, revisión del código (ESLint), pruebas unitarias de lib/ y compilación
#      completa, igual que en Vercel.
#   3. Navegador: los flujos clave con Playwright contra un Supabase local completo, en Chrome
#      de escritorio. Al lanzarlo A MANO (la pasada diaria y al rehacer fotos) se pasa además,
#      en paralelo y cada uno con su base de datos, en el motor de Safari (WebKit) y en un
#      iPhone. Incluye cómo se ven las pantallas (medidas y fotos de referencia).
#
# FOTOS DE REFERENCIA: tras un cambio de diseño hecho a propósito, lanzar el CI a mano
# (Run workflow) con la casilla «fotos»: las rehace y las guarda en la rama.
name: CI

on:
  push:
    branches: [pruebas]
  pull_request:
  workflow_dispatch:
    inputs:
      fotos:
        description: 'Rehacer las fotos de referencia de las pantallas (tras un cambio de diseño a propósito)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-de-datos:
    name: Base de datos (migraciones + pruebas)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL 16
        run: |
          if ! ls /usr/lib/postgresql/*/bin/postgres >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-contrib-16
          fi
          sudo systemctl stop postgresql || true
      - name: Migraciones y pruebas
        # El servidor corre con el usuario del sistema «postgres», que no puede leer la carpeta
        # del runner: se copian las migraciones y las pruebas a una carpeta legible.
        run: |
          rm -rf /tmp/ci && mkdir -p /tmp/ci && cp -r tools supabase /tmp/ci/ && chmod -R a+rX /tmp/ci
          sudo GENERAR_TIPOS=/tmp/ci/tipos.ts bash /tmp/ci/tools/probar-migraciones/probar.sh
      - name: Tipos de la base de datos al día
        # lib/supabase/tipos.ts se genera de las migraciones. Si una migración cambia tablas,
        # columnas o funciones, hay que regenerarlo (lo hace probar.sh con GENERAR_TIPOS).
        run: |
          if ! diff -u lib/supabase/tipos.ts /tmp/ci/tipos.ts > /tmp/ci/tipos.diff; then
            head -60 /tmp/ci/tipos.diff
            echo "::error::lib/supabase/tipos.ts no está al día con las migraciones: GENERAR_TIPOS=lib/supabase/tipos.ts sudo -E bash tools/probar-migraciones/probar.sh"
            exit 1
          fi

  web:
    name: Web (tipos, revisión, pruebas y compilación)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Revisión del código (ESLint)
        run: npm run lint
      - name: Pruebas unitarias (lib/)
        run: npm test
      - name: Entradas de las acciones al día
        # Cada acción del servidor comprueba su entrada con un esquema sacado de sus tipos
        # (lib/entradas/esquemas.ts). Si cambia una acción, hay que regenerarlo.
        run: node tools/entradas/generar.mjs --comprobar
      - name: Compilación
        run: npm run build

  navegador:
    # Los 6 flujos clave en un navegador (Playwright) contra un Supabase LOCAL completo (base
    # de datos, login, API y Realtime para el 6.º, «en vivo») con todas las migraciones y datos de prueba (tests/e2e). El
    # proyecto de Supabase se crea aparte en /tmp para no tocar supabase/config.toml (que se
    # despliega).
    name: Navegador (${{ matrix.nombre }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Escribir en el repositorio solo hace falta para guardar las fotos de referencia.
    permissions:
      contents: write
    strategy:
      fail-fast: false          # que el fallo de un navegador no corte los otros dos
      # En cada SUBIDA, solo Chrome (unos 9 minutos de Actions por subida, como antes). Safari
      # e iPhone se pasan al lanzar el CI a mano: la pasada diaria y al rehacer las fotos
      # (usuario, 2026-11-18: «tú mandas»; con los tres en cada subida eran unos 25 minutos).
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '[{"proyecto":"chromium","motor":"chromium","nombre":"Chrome de escritorio"},{"proyecto":"safari","motor":"webkit","nombre":"Safari de escritorio"},{"proyecto":"movil","motor":"webkit","nombre":"iPhone"}]'
          || '[{"proyecto":"chromium","motor":"chromium","nombre":"Chrome de escritorio"}]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # La CLI de Supabase se CACHEA: su servidor de descargas da 504 a rachas (2026-11-08
      # tumbó 4 de 5 runs sin llegar a las pruebas). Con la caché solo se descarga la
      # primera vez (y con 5 reintentos); después el binario sale de la caché de Actions.
      - name: Caché de la CLI de Supabase
        id: cache-supabase
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/supabase
          key: supabase-cli-2.122.1-linux-amd64
      - name: Instalar la CLI de Supabase (si no está en caché)
        if: steps.cache-supabase.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          for i in 1 2 3 4 5; do
            curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.122.1/supabase_linux_amd64.tar.gz && break
            echo "Descarga fallida (intento $i de 5); espero $((i*15)) s"
            [ "$i" = 5 ] && exit 1
            sleep $((i*15))
          done
          tar -xzf /tmp/supabase.tar.gz -C ~/.local/bin supabase
          chmod +x ~/.local/bin/supabase
          ~/.local/bin/supabase --version
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Supabase local con las migraciones
        run: |
          mkdir -p /tmp/sb && cd /tmp/sb && supabase init --force
          mkdir -p supabase/migrations && cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,mailpit,postgres-meta
          supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' | tr -d '"' >> "$GITHUB_ENV"
      - name: Datos de prueba
        run: node tests/e2e/semilla.mjs
      - name: Compilar y arrancar la plataforma
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SITE_URL: http://localhost:3000
        run: |
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run build
          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/panel/entrar && break; sleep 2; done
      - name: Navegador de Playwright
        run: npx playwright install ${{ matrix.motor }}
      # LIBRERÍAS DEL SISTEMA que necesita el navegador (WebKit, unas 180 y 125 MB; Chromium,
      # solo fuentes). Se bajan con apt, y sus espejos van a rachas lentísimos o colgados
      # (2026-11-11; 2026-11-18: 13 MB en 4 minutos, trabajos parados sin arrancar una
      # prueba). Por eso:
      #   · TODO lo bajado se guarda en caché (por navegador e imagen del runner), aunque la
      #     descarga no llegue a acabar: la pasada siguiente sigue donde se quedó esta;
      #   · con la caché completa se instala desde ahí, SIN red;
      #   · al bajar, apt va con tiempos de espera cortos y cada reintento prueba otro espejo.
      # En Chromium, si no se puede, las pruebas corren igual (son fuentes); en WebKit es
      # obligatorio.
      - name: Imagen del runner (para la caché de librerías)
        id: img
        run: echo "v=${ImageVersion:-sin-version}" >> "$GITHUB_OUTPUT"
      - name: Caché de las librerías del navegador
        uses: actions/cache/restore@v4
        with:
          path: ~/pw-debs
          key: pw-debs-${{ matrix.motor }}-pw1.63.0-${{ steps.img.outputs.v }}-${{ github.run_id }}-${{ matrix.proyecto }}
          restore-keys: pw-debs-${{ matrix.motor }}-pw1.63.0-${{ steps.img.outputs.v }}-
      - name: Librerías y fuentes del navegador
        id: libs
        run: |
          mkdir -p ~/pw-debs
          if [ -f ~/pw-debs/nada-que-instalar ]; then echo "La imagen ya trae todo lo necesario."; exit 0; fi
          antes=$(ls ~/pw-debs/*.deb 2>/dev/null | wc -l)
          if [ -f ~/pw-debs/completo ] && sudo dpkg -i ~/pw-debs/*.deb; then
            echo "Librerías instaladas desde la caché ($antes paquetes), sin red."; exit 0
          fi
          sudo mkdir -p /var/cache/pw-debs/partial
          if [ "$antes" -gt 0 ]; then echo "En caché: $antes paquetes de una descarga anterior."; sudo cp ~/pw-debs/*.deb /var/cache/pw-debs/; fi
          printf '%s\n' 'Dir::Cache::archives "/var/cache/pw-debs";' 'Acquire::http::Timeout "25";' 'Acquire::https::Timeout "25";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/99-ci-pruebas >/dev/null
          ok=no
          for espejo in "" "http://archive.ubuntu.com/ubuntu/" "http://azure.archive.ubuntu.com/ubuntu/" "http://mirrors.edge.kernel.org/ubuntu/" "http://archive.ubuntu.com/ubuntu/"; do
            if [ -n "$espejo" ]; then
              echo "Cambio de espejo de paquetes: $espejo"
              if [ -f /etc/apt/apt-mirrors.txt ]; then echo "$espejo" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
              sudo sed -i -E "s#https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#$espejo#g" /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            fi
            if timeout 240 npx playwright install-deps ${{ matrix.motor }}; then ok=si; break; fi
            echo "Instalación fallida, lenta o colgada con este espejo."
            sudo pkill -9 apt-get || true; sudo pkill -9 dpkg || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/pw-debs/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
            sudo dpkg --configure -a || true
          done
          # Lo bajado se guarda SIEMPRE, haya acabado o no.
          sudo sh -c "cp -n /var/cache/pw-debs/*.deb $HOME/pw-debs/ 2>/dev/null; chown -R $(id -u):$(id -g) $HOME/pw-debs"
          despues=$(ls ~/pw-debs/*.deb 2>/dev/null | wc -l)
          if [ "$ok" = si ]; then
            if [ "$despues" -gt 0 ]; then touch ~/pw-debs/completo; else touch ~/pw-debs/nada-que-instalar; fi
            echo "guardar=si" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$despues" != "$antes" ]; then echo "guardar=si" >> "$GITHUB_OUTPUT"; echo "Bajados $despues paquetes de momento; la próxima pasada sigue desde aquí."; fi
          if [ "${{ matrix.motor }}" = chromium ]; then
            echo "::warning::Fuentes del navegador sin instalar (espejos de paquetes lentos o caídos); las pruebas corren sin ellas"; exit 0
          fi
          echo "::error::No se han podido instalar las librerías de WebKit (espejos de paquetes lentos o caídos); lo bajado queda en caché para la próxima pasada"; exit 1
      - name: Guardar la caché de las librerías
        if: always() && steps.libs.outputs.guardar == 'si'
        uses: actions/cache/save@v4
        with:
          path: ~/pw-debs
          key: pw-debs-${{ matrix.motor }}-pw1.63.0-${{ steps.img.outputs.v }}-${{ github.run_id }}-${{ matrix.proyecto }}
      - name: Pruebas en navegador
        run: npx playwright test ${{ inputs.fotos && '--update-snapshots' || '' }}
        env:
          E2E_URL: http://localhost:3000
          E2E_PROYECTO: ${{ matrix.proyecto }}
      # Solo al lanzarlo a mano con la casilla «fotos»: las fotos de referencia recién
      # sacadas se guardan en la rama (cada navegador las suyas, en su carpeta).
      - name: Guardar las fotos de referencia
        if: inputs.fotos
        run: |
          git config user.name "Pruebas automáticas"
          git config user.email "pruebas@users.noreply.github.com"
          git add tests/e2e/fotos
          if git diff --cached --quiet; then echo "Las fotos no han cambiado."; exit 0; fi
          git commit -m "Fotos de referencia de las pantallas (${{ matrix.nombre }})"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i*7))
          done
          exit 1
      # Prueba de CARGA (k6, perfil humo; tarea 67): canario de regresiones gordas de
      # rendimiento contra la misma pila local, con la caché de Next ya caliente por las
      # pruebas de navegador. El examen fino (perfiles carga/estres) se hace a mano
      # contra la preview: tools/k6/README.md.
      - name: Prueba de carga (k6, humo)
        if: matrix.proyecto == 'chromium'
        run: |
          for i in 1 2 3; do
            curl -fsSL https://github.com/grafana/k6/releases/download/v1.3.0/k6-v1.3.0-linux-amd64.tar.gz | tar xz --strip-components=1 -C /tmp && break
            [ "$i" = 3 ] && exit 1; sleep 15
          done
          BASE_URL=http://localhost:3000 SUPABASE_URL=http://127.0.0.1:54321 SUPABASE_ANON_KEY="$ANON_KEY" /tmp/k6 run tools/k6/carga.js
      - name: Informe (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright-${{ matrix.proyecto }}
          path: |
            playwright-report
            test-results
            /tmp/next.log
          retention-days: 7
