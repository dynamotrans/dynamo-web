# Red de seguridad en cada subida (revisión de calidad, 2026-11-05): si algo falla, se ve en
# rojo en GitHub antes de darlo por bueno.
#   1. Base de datos: aplica todas las migraciones en un PostgreSQL de usar y tirar que imita a
#      Supabase, pasa las pruebas de seguridad y de reglas (tools/probar-migraciones) y comprueba
#      que los tipos de TypeScript (lib/supabase/tipos.ts) están al día.
#   2. Web: tipos, revisión del código (ESLint), pruebas unitarias de lib/ y compilación
#      completa, igual que en Vercel.
name: CI

on:
  push:
    branches: [pruebas]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-de-datos:
    name: Base de datos (migraciones + pruebas)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL 16
        run: |
          if ! ls /usr/lib/postgresql/*/bin/postgres >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-contrib-16
          fi
          sudo systemctl stop postgresql || true
      - name: Migraciones y pruebas
        # El servidor corre con el usuario del sistema «postgres», que no puede leer la carpeta
        # del runner: se copian las migraciones y las pruebas a una carpeta legible.
        run: |
          rm -rf /tmp/ci && mkdir -p /tmp/ci && cp -r tools supabase /tmp/ci/ && chmod -R a+rX /tmp/ci
          sudo GENERAR_TIPOS=/tmp/ci/tipos.ts bash /tmp/ci/tools/probar-migraciones/probar.sh
      - name: Tipos de la base de datos al día
        # lib/supabase/tipos.ts se genera de las migraciones. Si una migración cambia tablas,
        # columnas o funciones, hay que regenerarlo (lo hace probar.sh con GENERAR_TIPOS).
        run: |
          if ! diff -u lib/supabase/tipos.ts /tmp/ci/tipos.ts > /tmp/ci/tipos.diff; then
            head -60 /tmp/ci/tipos.diff
            echo "::error::lib/supabase/tipos.ts no está al día con las migraciones: GENERAR_TIPOS=lib/supabase/tipos.ts sudo -E bash tools/probar-migraciones/probar.sh"
            exit 1
          fi

  web:
    name: Web (tipos, revisión, pruebas y compilación)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Revisión del código (ESLint)
        run: npm run lint
      - name: Pruebas unitarias (lib/)
        run: npm test
      - name: Compilación
        run: npm run build
