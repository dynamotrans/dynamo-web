# Red de seguridad en cada subida (revisión de calidad, 2026-11-05): si algo falla, se ve en
# rojo en GitHub antes de darlo por bueno.
#   1. Base de datos: aplica todas las migraciones en un PostgreSQL de usar y tirar que imita a
#      Supabase, pasa las pruebas de seguridad y de reglas (tools/probar-migraciones) y comprueba
#      que los tipos de TypeScript (lib/supabase/tipos.ts) están al día.
#   2. Web: tipos, revisión del código (ESLint), pruebas unitarias de lib/ y compilación
#      completa, igual que en Vercel.
#   3. Navegador: los 6 flujos clave con Playwright contra un Supabase local completo.
name: CI

on:
  push:
    branches: [pruebas]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-de-datos:
    name: Base de datos (migraciones + pruebas)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL 16
        run: |
          if ! ls /usr/lib/postgresql/*/bin/postgres >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-contrib-16
          fi
          sudo systemctl stop postgresql || true
      - name: Migraciones y pruebas
        # El servidor corre con el usuario del sistema «postgres», que no puede leer la carpeta
        # del runner: se copian las migraciones y las pruebas a una carpeta legible.
        run: |
          rm -rf /tmp/ci && mkdir -p /tmp/ci && cp -r tools supabase /tmp/ci/ && chmod -R a+rX /tmp/ci
          sudo GENERAR_TIPOS=/tmp/ci/tipos.ts bash /tmp/ci/tools/probar-migraciones/probar.sh
      - name: Tipos de la base de datos al día
        # lib/supabase/tipos.ts se genera de las migraciones. Si una migración cambia tablas,
        # columnas o funciones, hay que regenerarlo (lo hace probar.sh con GENERAR_TIPOS).
        run: |
          if ! diff -u lib/supabase/tipos.ts /tmp/ci/tipos.ts > /tmp/ci/tipos.diff; then
            head -60 /tmp/ci/tipos.diff
            echo "::error::lib/supabase/tipos.ts no está al día con las migraciones: GENERAR_TIPOS=lib/supabase/tipos.ts sudo -E bash tools/probar-migraciones/probar.sh"
            exit 1
          fi

  web:
    name: Web (tipos, revisión, pruebas y compilación)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Revisión del código (ESLint)
        run: npm run lint
      - name: Pruebas unitarias (lib/)
        run: npm test
      - name: Entradas de las acciones al día
        # Cada acción del servidor comprueba su entrada con un esquema sacado de sus tipos
        # (lib/entradas/esquemas.ts). Si cambia una acción, hay que regenerarlo.
        run: node tools/entradas/generar.mjs --comprobar
      - name: Compilación
        run: npm run build

  navegador:
    # Los 6 flujos clave en un navegador (Playwright) contra un Supabase LOCAL completo (base
    # de datos, login, API y Realtime para el 6.º, «en vivo») con todas las migraciones y datos de prueba (tests/e2e). El
    # proyecto de Supabase se crea aparte en /tmp para no tocar supabase/config.toml (que se
    # despliega).
    name: Navegador (6 flujos clave)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # La CLI de Supabase se CACHEA: su servidor de descargas da 504 a rachas (2026-11-08
      # tumbó 4 de 5 runs sin llegar a las pruebas). Con la caché solo se descarga la
      # primera vez (y con 5 reintentos); después el binario sale de la caché de Actions.
      - name: Caché de la CLI de Supabase
        id: cache-supabase
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/supabase
          key: supabase-cli-2.122.1-linux-amd64
      - name: Instalar la CLI de Supabase (si no está en caché)
        if: steps.cache-supabase.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          for i in 1 2 3 4 5; do
            curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.122.1/supabase_linux_amd64.tar.gz && break
            echo "Descarga fallida (intento $i de 5); espero $((i*15)) s"
            [ "$i" = 5 ] && exit 1
            sleep $((i*15))
          done
          tar -xzf /tmp/supabase.tar.gz -C ~/.local/bin supabase
          chmod +x ~/.local/bin/supabase
          ~/.local/bin/supabase --version
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Supabase local con las migraciones
        run: |
          mkdir -p /tmp/sb && cd /tmp/sb && supabase init --force
          mkdir -p supabase/migrations && cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,mailpit,postgres-meta
          supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' | tr -d '"' >> "$GITHUB_ENV"
      - name: Datos de prueba
        run: node tests/e2e/semilla.mjs
      - name: Compilar y arrancar la plataforma
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SITE_URL: http://localhost:3000
        run: |
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run build
          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/panel/entrar && break; sleep 2; done
      - run: npx playwright install --with-deps chromium
      - name: Pruebas en navegador
        run: npx playwright test
        env:
          E2E_URL: http://localhost:3000
      - name: Informe (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: |
            playwright-report
            test-results
            /tmp/next.log
          retention-days: 7
