name: Pasada diaria de pruebas (rama pruebas)

# Cada mañana lanza todas las pruebas de la plataforma (el CI de la rama pruebas, con Chrome,
# Safari e iPhone) aunque no se haya subido nada, para cazar fallos que dependen de la fecha
# (festivos, cambio de mes, horarios). Va en main porque GitHub solo lanza las tareas con
# horario desde la rama principal; no toca la web ni se publica nada.
# Espera a que terminen: si algo falla, esta tarea sale en rojo y GitHub manda un email
# automático al propietario del repo (como la del uptime). Es independiente del chat de Claude.
on:
  schedule:
    - cron: '17 5 * * *'     # 05:17 UTC = 06:17 en Madrid en invierno, 07:17 en verano
  workflow_dispatch:

permissions:
  actions: write

jobs:
  lanzar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Lanzar el CI de la rama pruebas y esperar el resultado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          antes=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --ref pruebas
          id=""
          for i in $(seq 1 30); do
            sleep 10
            id=$(gh run list --workflow ci.yml --branch pruebas --event workflow_dispatch --limit 5 \
                   --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$antes\")][0].databaseId // empty")
            [ -n "$id" ] && break
          done
          if [ -z "$id" ]; then echo "::error::No se encontró la ejecución del CI lanzada"; exit 1; fi
          echo "Ejecución del CI: https://github.com/$GH_REPO/actions/runs/$id"
          gh run watch "$id" --interval 60 --exit-status > /dev/null || {
            echo "::error::La pasada diaria de pruebas ha fallado: https://github.com/$GH_REPO/actions/runs/$id"
            exit 1
          }
          echo "Todo en verde"
