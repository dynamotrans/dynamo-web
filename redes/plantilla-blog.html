<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--purple:#3300cc;--purple2:#4a1ae0;--navy:#0a0230;--green:#85d85a;--yellow:#e3dc0e;--orange:#ff6a13;--green2:#00c060}
body{width:1080px;height:1350px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff;position:relative;background:var(--navy)}
.photo{position:absolute;left:0;right:0;top:0;height:760px;background:url("../images/hero-camiones-dynamo.jpg") center 60%/cover no-repeat}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(51,0,204,.85) 0%,rgba(51,0,204,.7) 22%,rgba(30,8,130,.9) 40%,rgba(20,6,90,.95) 52%,var(--navy) 62%)}
.glow{position:absolute;inset:0;background:radial-gradient(700px 500px at 90% 95%,rgba(74,26,224,.55),transparent 70%)}
.logo{position:absolute;top:72px;left:80px;width:270px}
.claim{position:absolute;top:84px;right:80px;font-weight:700;font-size:26px;opacity:.9}
.pill{position:absolute;top:250px;left:80px;display:flex;align-items:center;gap:14px;background:var(--green);color:var(--navy);font-weight:900;font-size:28px;letter-spacing:2px;text-transform:uppercase;padding:16px 28px;border-radius:999px;box-shadow:0 10px 30px rgba(133,216,90,.35)}
.pill i{width:14px;height:14px;border-radius:50%;background:var(--navy)}
.hook{position:absolute;top:350px;left:80px;right:80px;font-weight:800;font-size:46px;line-height:1.15;letter-spacing:-1px}
.card{position:absolute;left:60px;right:60px;top:500px;background:#fff;color:var(--navy);border-radius:40px;padding:56px 60px 48px;box-shadow:0 40px 90px rgba(0,0,0,.45)}
.card:before{content:"";position:absolute;left:60px;top:-1px;width:120px;height:8px;border-radius:0 0 8px 8px;background:linear-gradient(90deg,var(--purple),var(--green));display:none}
.meta{display:flex;gap:18px;align-items:center;font-weight:700;font-size:24px;color:#5b5878}
.meta .tag{background:#efeaff;color:var(--purple);padding:8px 18px;border-radius:999px;font-weight:800}
.title{margin-top:30px;font-weight:900;font-size:64px;line-height:1.06;letter-spacing:-2px}
.title em{font-style:normal;color:var(--purple);background:linear-gradient(transparent 68%,rgba(133,216,90,.6) 68%)}
.lead{margin-top:26px;font-weight:500;font-size:29px;line-height:1.4;color:#45425f}
.author{margin-top:38px;padding-top:30px;border-top:2px solid #eeedf4;display:flex;align-items:center;gap:20px}
.author img{width:78px;height:78px;border-radius:50%}
.author b{display:block;font-size:27px;font-weight:800}
.author span{font-size:23px;color:#6b6888;font-weight:600}
.author .rt{margin-left:auto;font-size:23px;font-weight:700;color:var(--purple)}
.foot{position:absolute;left:80px;right:80px;bottom:62px;display:flex;justify-content:space-between;align-items:center}
.foot .site{font-weight:900;font-size:36px}.foot .site em{font-style:normal;color:var(--green)}
.foot .go{font-weight:800;font-size:26px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);padding:14px 26px;border-radius:999px}
.bar{position:absolute;left:0;right:0;bottom:0;height:14px;display:flex}
.bar i{flex:1}.bar i:nth-child(1){background:var(--yellow)}.bar i:nth-child(2){background:var(--green2)}.bar i:nth-child(3){background:var(--orange)}
/* ---------- Historia 1080x1920 ---------- */
body.story{height:1920px}
.story .photo{height:1080px}
.story .veil{background:linear-gradient(180deg,rgba(51,0,204,.85) 0%,rgba(51,0,204,.7) 20%,rgba(30,8,130,.9) 38%,rgba(20,6,90,.95) 50%,var(--navy) 58%)}
.story .logo{top:150px}.story .claim{top:162px}
.story .pill{top:420px}
.story .hook{top:530px;font-size:52px}
.story .card{top:720px}
.story .foot{bottom:150px;flex-direction:column;align-items:flex-start;gap:34px}
.story .foot .go{font-size:32px;padding:20px 34px;background:var(--green);color:var(--navy);border-color:var(--green)}
/* ---------- Franja de llamada a la acción (pegada al pie) ---------- */
.bar{display:none}
.band{position:absolute;left:0;right:0;bottom:0;height:130px;background:#fff;color:var(--purple);display:flex;align-items:center;gap:22px;padding:6px 64px 0 72px;z-index:6}
.band:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--yellow) 0 33.34%,var(--green2) 33.34% 66.67%,var(--orange) 66.67%)}
.band .clk{position:static;width:60px;height:60px;flex:0 0 60px}
.band .bt{display:flex;flex-direction:column;gap:4px}
.band b{font-weight:900;font-size:44px;line-height:1;letter-spacing:-1px}
.band span{font-weight:700;font-size:24px;color:#6b6888}
.band .go{margin-left:auto;width:68px;height:68px;border-radius:50%;background:var(--purple);color:#fff;font-style:normal;font-weight:900;font-size:36px;display:flex;align-items:center;justify-content:center}
.story .band{height:160px}
.story .band b{font-size:50px}.story .band span{font-size:27px}
.foot{bottom:170px}
body:not(.story) .logo{top:56px}body:not(.story) .claim{top:68px}body:not(.story) .pill{top:200px}body:not(.story) .hook{top:296px}body:not(.story) .card{top:440px}
.story .foot{bottom:220px}
/* STORY: franja pegada al pie */
.story .band{bottom:0;height:170px}
.story .foot{bottom:230px;gap:30px}
.story .logo{top:250px}.story .claim{top:262px}
.story .pill{top:380px}
.story .hook{top:470px}
.story .card{top:640px}
</style></head><body class="{{FORMAT}}">
<div class="photo"></div><div class="veil"></div><div class="glow"></div>
<img class="logo" src="../images/4.png"><div class="claim">Always Moving.</div>
<div class="pill"><i></i>Nuevo en el blog</div>
<div class="hook">{{HOOK}}</div>
<div class="card">
  <div class="meta"><span class="tag">{{TAG}}</span><span>{{DATE}}</span></div>
  <div class="title">{{TITLE}}</div>
  <div class="lead">{{LEAD}}</div>
  <div class="author"><img src="../images/ALVARO_circular_ZOOM.png"><div><b>Álvaro Blanco</b><span>Dynamo Trans · Sevilla</span></div><div class="rt">{{MIN}} min de lectura</div></div>
</div>
<div class="foot"><div class="site">dynamotrans.com<em>/blog</em></div><div class="go">{{GO}}</div></div>
<div class="band"><svg class="clk" viewBox="0 0 32 32" fill="none"><g stroke="#3300cc" stroke-width="2.6" stroke-linecap="round"><path d="M11 1.5v3.2"/><path d="M3.5 9h3.2"/><path d="M5.6 3.6l2.2 2.2"/><path d="M16.4 3.6l-2.2 2.2"/></g><path d="M11 9v18l4.5-4.5 3 6.5 3-1.3-2.9-6.4h5.9z" fill="#3300cc" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg><div class="bt"><b>Pide transporte online</b><span>en dynamotrans.com</span></div><i class="go">→</i></div>
<div class="bar"><i></i><i></i><i></i></div>
</body></html>
