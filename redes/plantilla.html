<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--purple:#3300cc;--purple2:#4a1ae0;--navy:#0a0230;--green:#85d85a;--yellow:#e3dc0e;--orange:#ff6a13;--green2:#00c060}
body{width:1080px;height:1080px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff;position:relative;background:var(--purple)}
.bar{position:absolute;left:0;right:0;bottom:0;height:14px;display:flex;z-index:5}
.bar i{flex:1}.bar i:nth-child(1){background:var(--yellow)}.bar i:nth-child(2){background:var(--green2)}.bar i:nth-child(3){background:var(--orange)}
.logo{position:absolute;top:84px;left:84px;width:300px;z-index:4}
.claim{position:absolute;top:92px;right:84px;font-weight:700;font-size:26px;opacity:.9;z-index:4}
.foot{position:absolute;left:84px;right:84px;bottom:60px;display:flex;justify-content:space-between;align-items:flex-end;z-index:4}
.foot .site{font-weight:900;font-size:30px}.foot .tag{font-weight:700;font-size:22px;opacity:.85}
em{font-style:normal;color:var(--green)}
.ctag{display:inline-flex;align-items:center;gap:12px;background:#fff;color:var(--purple);font-weight:800;font-size:26px;padding:12px 26px 12px 18px;border-radius:999px;box-shadow:0 8px 26px rgba(0,0,0,.28);white-space:nowrap}
.ctag .clk{position:static;width:34px;height:34px;flex:0 0 34px}
.v4 .ctag{background:var(--purple);color:#fff}
svg{position:absolute}
.kicker,.list,.photo,.veil,.grid,.truck,.road,.pallets,.map{display:none}
.v1 .truck,.v1 .road,.v2 .grid,.v2 .kicker,.v2 .pallets,.v3 .photo,.v3 .veil,.v4 .list,.v4 .map{display:block}
.title:empty,.body:empty{display:none}

/* ---------- V1: tarjeta morada + camión en línea ---------- */
.v1 .bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 85% 10%,var(--purple2) 0%,rgba(74,26,224,0) 60%),radial-gradient(700px 600px at 10% 95%,var(--navy) 0%,rgba(10,2,48,0) 65%),var(--purple)}
.v1 .title{position:absolute;left:84px;right:84px;top:290px;font-weight:900;font-size:84px;line-height:1.02;letter-spacing:-2px}
.v1 .body{position:absolute;left:84px;right:140px;top:580px;font-weight:500;font-size:34px;line-height:1.35;color:rgba(255,255,255,.92)}
.v1 .truck{right:60px;bottom:150px;width:470px;opacity:.95}
.v1 .road{left:-40px;right:-40px;bottom:138px;height:40px;width:1160px}

/* ---------- V2: dato grande, navy ---------- */
.v2{background:var(--navy)}
.v2 .bg{position:absolute;inset:0;background:radial-gradient(800px 800px at 80% 80%,#1a0a6a 0%,rgba(26,10,106,0) 60%),var(--navy)}
.v2 .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(600px 600px at 30% 60%,#000 20%,transparent 100%)}
.v2 .kicker{position:absolute;left:84px;top:270px;font-weight:700;font-size:30px;color:var(--green);letter-spacing:2px;text-transform:uppercase}
.v2 .title{position:absolute;left:84px;top:320px;font-weight:900;font-size:230px;line-height:.95;letter-spacing:-10px}
.v2 .title em{color:#fff}
.v2 .body{position:absolute;left:84px;width:560px;top:600px;font-weight:500;font-size:36px;line-height:1.3}
.v2 .pallets{right:70px;bottom:150px;width:360px}

/* ---------- V3: foto real + velo ---------- */
.v3 .photo{position:absolute;inset:0;background:url("../images/HERO-DYNAMO.webp") 40% center/cover no-repeat}
.v3 .photo.alt{background-image:url("../images/hero-camiones-dynamo.jpg")}
.v3 .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(51,0,204,.96) 0%,rgba(51,0,204,.9) 48%,rgba(10,2,48,.25) 72%,rgba(10,2,48,.55) 100%)}
.v3 .title{position:absolute;left:84px;right:84px;top:230px;font-weight:900;font-size:78px;line-height:1.04;letter-spacing:-2px;text-shadow:0 4px 24px rgba(0,0,0,.4)}
.v3 .body{position:absolute;left:84px;right:140px;top:420px;font-weight:600;font-size:30px;line-height:1.35}
.v3 .foot .tag,.v3 .claim{opacity:1}

/* ---------- V4: fondo claro, logo a color ---------- */
.v4{background:#f7f8fa;color:var(--navy)}
.v4 .bg{position:absolute;inset:0;background:radial-gradient(700px 500px at 90% 0%,#ebe6ff 0%,rgba(235,230,255,0) 70%),#f7f8fa}
.v4 .logo{width:300px}
.v4 .claim{color:var(--purple)}
.v4 .title{position:absolute;left:84px;right:84px;top:290px;font-weight:900;font-size:78px;line-height:1.04;letter-spacing:-2px;color:var(--purple)}
.v4 .title em{color:var(--green2)}
.v4 .list{position:absolute;left:84px;right:420px;top:560px;list-style:none;font-weight:600;font-size:34px;line-height:1.3}
.v4 .list li{display:flex;gap:22px;align-items:flex-start;margin-bottom:26px}
.v4 .list li::before{content:"";flex:0 0 18px;height:18px;margin-top:14px;border-radius:50%;background:var(--purple)}
.v4 .list li:nth-child(2)::before{background:var(--green2)}.v4 .list li:nth-child(3)::before{background:var(--orange)}
.v4 .foot .site{color:var(--purple)}.v4 .foot .tag{color:#555}
.v4 .map{right:50px;bottom:120px;width:330px;opacity:.9}

/* ---------- STORY 1080x1920 (zona segura: 250px arriba y abajo) ---------- */
.story{height:1920px}
.story .logo{top:260px}.story .claim{top:268px}
.story .foot{bottom:230px}.story .bar{height:18px}
.story .cta{position:absolute;left:84px;right:84px;bottom:330px;z-index:4;display:flex;align-items:center;gap:18px;font-weight:700;font-size:30px}
.story .cta span{background:var(--green2);color:#fff;padding:16px 28px;border-radius:40px}
.story.v4 .cta span{background:var(--purple)}
.story.v1 .title{top:560px;font-size:92px}
.story.v1 .body{top:900px;font-size:38px;right:84px}
.story.v1 .truck{right:40px;bottom:480px;width:520px}
.story.v1 .road{bottom:468px}
.story.v2 .kicker{top:540px}
.story.v2 .title{top:600px;font-size:260px}
.story.v2 .body{top:920px;width:900px;font-size:40px}
.story.v2 .pallets{right:60px;bottom:460px;width:380px}
.story.v3 .photo{background-position:42% 85%}
.story.v3 .veil{background:linear-gradient(180deg,rgba(51,0,204,.97) 0%,rgba(51,0,204,.92) 50%,rgba(10,2,48,.2) 70%,rgba(10,2,48,.6) 100%)}
.story.v3 .title{top:520px;font-size:88px}
.story.v3 .body{top:880px;font-size:36px;right:84px}
.story.v4 .title{top:540px;font-size:86px}
.story.v4 .list{top:900px;right:84px;font-size:38px}
.story.v4 .map{right:40px;bottom:450px;width:300px}
.story .cta{display:none}.story .cta.on{display:flex}
</style></head>
<body class="{{VARIANT}} {{FORMAT}}">
<div class="bg"></div>
<div class="grid"></div>
<div class="photo {{PHOTO}}"></div><div class="veil"></div>

<img class="logo" src="{{LOGO}}" alt="dynamo">
<div class="claim">Always Moving.</div>

<div class="kicker">{{KICKER}}</div>
<div class="title">{{TITLE}}</div>
<div class="body">{{BODY}}</div>
<ul class="list">{{LIST}}</ul>

<!-- carretera + camión (V1) -->
<svg class="road" viewBox="0 0 1160 40"><path d="M0 30 H1160" stroke="rgba(255,255,255,.18)" stroke-width="3"/><path d="M0 30 H1160" stroke="#85d85a" stroke-width="5" stroke-dasharray="70 60" opacity=".9"/></svg>
<svg class="truck" viewBox="0 0 470 190" fill="none">
  <rect x="120" y="20" width="330" height="120" rx="12" fill="#fff"/>
  <rect x="120" y="20" width="330" height="120" rx="12" fill="url(#g)" opacity=".15"/>
  <path d="M120 60 H450" stroke="#3300cc" stroke-width="4" opacity=".25"/>
  <text x="285" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="44" fill="#3300cc">dynamo</text>
  <path d="M20 140 V70 a12 12 0 0 1 12-12 H85 l30 30 v52 Z" fill="#fff"/>
  <path d="M40 70 H82 l22 22 H40 Z" fill="#3300cc" opacity=".85"/><rect x="20" y="118" width="95" height="8" fill="#85d85a"/>
  <rect x="2" y="138" width="460" height="10" rx="5" fill="#0a0230"/>
  <g fill="#0a0230"><circle cx="60" cy="150" r="22"/><circle cx="170" cy="150" r="22"/><circle cx="330" cy="150" r="22"/><circle cx="390" cy="150" r="22"/></g>
  <g fill="#8e8e8e"><circle cx="60" cy="150" r="9"/><circle cx="170" cy="150" r="9"/><circle cx="330" cy="150" r="9"/><circle cx="390" cy="150" r="9"/></g>
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e3dc0e"/><stop offset=".5" stop-color="#00c060"/><stop offset="1" stop-color="#ff6a13"/></linearGradient></defs>
</svg>

<!-- palets (V2) -->
<svg class="pallets" viewBox="0 0 360 300" fill="none">
  <g transform="translate(0,120)">
    <rect x="30" y="60" width="300" height="24" rx="4" fill="#c9a06b"/><rect x="30" y="100" width="300" height="24" rx="4" fill="#c9a06b"/>
    <rect x="40" y="84" width="40" height="16" fill="#8e6a3e"/><rect x="160" y="84" width="40" height="16" fill="#8e6a3e"/><rect x="280" y="84" width="40" height="16" fill="#8e6a3e"/>
    <rect x="50" y="-40" width="120" height="100" rx="6" fill="#85d85a"/><rect x="190" y="-40" width="120" height="100" rx="6" fill="#3300cc" stroke="#85d85a" stroke-width="3"/>
    <rect x="80" y="-130" width="120" height="90" rx="6" fill="#ff6a13"/><rect x="200" y="-130" width="90" height="90" rx="6" fill="#e3dc0e"/>
  </g>
</svg>

<!-- mapa / ruta (V4) -->
<svg class="map" viewBox="0 0 330 330" fill="none">
  <circle cx="165" cy="165" r="150" fill="#ebe6ff"/>
  <path d="M60 240 C110 200, 120 120, 180 110 S270 90, 280 70" stroke="#3300cc" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/>
  <circle cx="60" cy="240" r="16" fill="#ff6a13"/><circle cx="280" cy="70" r="16" fill="#00c060"/>
  <g transform="translate(150,135)"><rect x="-26" y="-14" width="52" height="28" rx="6" fill="#3300cc"/><rect x="-40" y="-6" width="16" height="20" rx="3" fill="#3300cc"/><circle cx="-26" cy="18" r="6" fill="#0a0230"/><circle cx="12" cy="18" r="6" fill="#0a0230"/></g>
</svg>

<div class="cta {{CTAON}}"><span>{{CTA}}</span></div>
<div class="foot"><div class="site">dynamotrans.com</div><div class="ctag"><svg class="clk" viewBox="0 0 32 32" fill="none"><g stroke="#00c060" stroke-width="2.4" stroke-linecap="round"><path d="M11 1.5v3.2"/><path d="M3.5 9h3.2"/><path d="M5.6 3.6l2.2 2.2"/><path d="M16.4 3.6l-2.2 2.2"/></g><path d="M11 9v18l4.5-4.5 3 6.5 3-1.3-2.9-6.4h5.9z" fill="currentColor" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>Pide transporte online</div></div>
<div class="bar"><i></i><i></i><i></i></div>
</body></html>
