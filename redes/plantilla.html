<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#3300cc;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(900px 700px at 85% 10%,#4a1ae0 0%,rgba(74,26,224,0) 60%),
 radial-gradient(700px 600px at 10% 95%,#0a0230 0%,rgba(10,2,48,0) 65%),#3300cc}
.road{position:absolute;left:-120px;right:-120px;bottom:215px;height:3px;background:rgba(255,255,255,.18);transform:rotate(-6deg)}
.road::before{content:"";position:absolute;left:0;right:0;top:-7px;height:17px;
 background:repeating-linear-gradient(90deg,transparent 0 60px,#85d85a 60px 150px);opacity:.9;clip-path:inset(7px 0 7px 0)}
.logo{position:absolute;top:84px;left:84px;width:300px}
.claim{position:absolute;top:92px;right:84px;font-weight:700;font-size:26px;letter-spacing:.5px;opacity:.9;text-align:right;line-height:1.25}
.title{position:absolute;left:84px;right:84px;top:300px;font-weight:900;font-size:84px;line-height:1.02;letter-spacing:-2px}
.title em{font-style:normal;color:#85d85a}
.body{position:absolute;left:84px;right:140px;top:620px;font-weight:500;font-size:34px;line-height:1.35;color:rgba(255,255,255,.92)}
.foot{position:absolute;left:84px;right:84px;bottom:60px;display:flex;justify-content:space-between;align-items:flex-end}
.foot .site{font-weight:900;font-size:30px}
.foot .tag{font-weight:700;font-size:22px;opacity:.85}
.bar{position:absolute;left:0;right:0;bottom:0;height:14px;display:flex}
.bar i{flex:1}.bar i:nth-child(1){background:#e3dc0e}.bar i:nth-child(2){background:#00c060}.bar i:nth-child(3){background:#ff6a13}
</style></head><body>
<div class="bg"></div><div class="road"></div>
<img class="logo" src="../images/4.png" alt="dynamo">
<div class="claim">Always Moving.</div>
<div class="title">{{TITLE}}</div>
<div class="body">{{BODY}}</div>
<div class="foot"><div class="site">dynamotrans.com</div><div class="tag">Grupajes · Carga completa · España y Europa</div></div>
<div class="bar"><i></i><i></i><i></i></div>
</body></html>
